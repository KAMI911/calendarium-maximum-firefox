<!doctype html>
<!--
  view.html — standalone "full view" page.

  Reached from the toolbar action's "Open full view in a new tab" context
  menu item (wired up in background.js via browser.menus), since
  moz-extension://<uuid>/... URLs are randomized per install and can't be
  bookmarked directly by users ahead of time.

  This is intentionally NOT a separate view.js/view.css: the page has the
  exact same long-lived-tab lifecycle as the New Tab override (full
  widget, 60s refresh, Wikipedia rotation), so it reuses newtab.js's
  orchestration and newtab.css's layout verbatim rather than duplicating
  either — only the markup lives in this file, identical to newtab.html's
  <body>.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Calendarium Maximum</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div id="calendarium-shell" class="calendarium-shell">

    <!-- Single flowing area: the calendar panel plus every widget, all
         as equal-status boxes in one CSS multi-column container
         (newtab.css's "columns" rule on #calendarium-widgets) — this is
         what gives the "prefer stacking, spread sideways only once
         there's genuinely enough room, never force horizontal scroll"
         behavior: multi-column only opens a 2nd/3rd/4th column of
         --cal-panel-width when the container is actually wide enough to
         fit one, otherwise everything just stacks in a single column.
         #calendarium-container (the calendar) is the first child here,
         carries .calendarium-widget for the same box chrome as the
         others, but (like Search) has no header — see newtab.css. Each
         <section class="calendarium-widget"> is independently toggled
         via [hidden] and carries a data-size attribute ("large" |
         "small" | "collapsed") controlled by its own header buttons —
         see wireWidgetHeaderControls() in lib/render.js. DOM order here
         is only the *default* widget order (the calendar always stays
         first) — a user-configured re-order of the other widgets
         physically moves those nodes at runtime (applyWidgetOrder() in
         lib/render.js), since multi-column layout (unlike flex/grid) has
         no CSS-only reordering mechanism. -->
    <aside id="calendarium-widgets" class="calendarium-widgets">

      <main id="calendarium-container" class="calendarium-widget calendarium-container">

      <div id="cal-date" class="calendarium-date"></div>
      <div id="cal-time" class="calendarium-time"></div>

      <div id="cal-progress-row1" class="calendarium-progress-row">
        <span id="cal-day-of-year" class="calendarium-progress" tabindex="0"></span>
        <span id="cal-new-year" class="calendarium-newyear" tabindex="0"></span>
      </div>
      <div id="cal-progress-row2" class="calendarium-progress-row">
        <span id="cal-week-number" class="calendarium-progress" tabindex="0"></span>
        <span id="cal-month-progress" class="calendarium-progress" tabindex="0"></span>
      </div>

      <div id="cal-traditional" class="calendarium-traditional"></div>
      <div id="cal-folkday" class="calendarium-folkday"></div>

      <div id="cal-holiday" class="calendarium-holiday"></div>
      <pre id="cal-holiday-upcoming" class="calendarium-holiday-upcoming"></pre>
      <pre id="cal-period" class="calendarium-period"></pre>
      <pre id="cal-period-upcoming" class="calendarium-period-upcoming"></pre>

      <div id="cal-moon-row" class="calendarium-moon-row">
        <span id="cal-moon-icon" class="calendarium-moon-icon" tabindex="0"></span>
        <span id="cal-moon-text" class="calendarium-moon"></span>
        <span id="cal-moon-age" class="calendarium-moon-age" tabindex="0"></span>
      </div>

      <div id="cal-moonrise-row" class="calendarium-moontime-row">
        <span id="cal-moonrise" class="calendarium-moontime" tabindex="0"></span>
        <span id="cal-moonset" class="calendarium-moontime" tabindex="0"></span>
      </div>

      <div id="cal-sun-row" class="calendarium-sun-row">
        <span id="cal-sunrise" class="calendarium-sun" tabindex="0"></span>
        <span id="cal-sunset" class="calendarium-sun" tabindex="0"></span>
      </div>

      <div id="cal-city-grid" class="calendarium-city-grid"></div>

      <div id="cal-weather-primary" class="calendarium-weather-primary" tabindex="0"></div>
      <div id="cal-weather-cities" class="calendarium-weather-cities"></div>

      <div id="cal-zodiac-row" class="calendarium-zodiac-row">
        <span id="cal-zodiac-western-part" class="calendarium-zodiac-part">
          <span id="cal-zodiac-western-icon" class="calendarium-zodiac-icon" tabindex="0"></span>
          <span id="cal-zodiac-western-text" class="calendarium-zodiac-western"></span>
        </span>
        <span id="cal-zodiac-chinese-part" class="calendarium-zodiac-part">
          <span id="cal-zodiac-chinese-icon" class="calendarium-zodiac-icon" tabindex="0"></span>
          <span id="cal-zodiac-chinese-text" class="calendarium-zodiac-chinese"></span>
        </span>
      </div>

      <div id="cal-solstice" class="calendarium-solstice"></div>

      <div id="cal-nameday-today" class="calendarium-nameday"></div>
      <div id="cal-nameday-future" class="calendarium-nameday-future"></div>

      <div id="cal-wiki-events-header" class="calendarium-wiki-header"></div>
      <pre id="cal-wiki-events" class="calendarium-wiki"></pre>
      <div id="cal-wiki-births-header" class="calendarium-wiki-header"></div>
      <pre id="cal-wiki-births" class="calendarium-wiki"></pre>
      <div id="cal-wiki-deaths-header" class="calendarium-wiki-header"></div>
      <pre id="cal-wiki-deaths" class="calendarium-wiki"></pre>
      <div id="cal-wiki-featured-header" class="calendarium-wiki-header"></div>
      <pre id="cal-wiki-featured" class="calendarium-wiki-featured"></pre>

      <pre id="cal-altcal" class="calendarium-altcal"></pre>

      </main>

      <!-- No header/title bar by design — a bare search box reads oddly
           with a titled chrome bar above it, unlike the data-driven
           widgets below. Still a .calendarium-widget (shares the same
           panel background/opacity and participates in widget-order)
           and still data-widget="search" for that ordering, just without
           the header's size/collapse controls. -->
      <section id="widget-search" class="calendarium-widget" data-widget="search" hidden>
        <div class="calendarium-widget-body">
          <form id="cal-search-form" class="calendarium-search-form">
            <span id="cal-search-engine-select" class="calendarium-search-engine-select" hidden></span>
            <input id="cal-search-input" type="search" name="q" class="calendarium-search-input"
                   autocomplete="off">
            <button type="submit" class="calendarium-search-submit" aria-label="Search">🔍</button>
          </form>
        </div>
      </section>

      <section id="widget-shortcuts" class="calendarium-widget" data-widget="shortcuts" data-size="large" hidden>
        <header class="calendarium-widget-header">
          <h2 id="widget-shortcuts-title" class="calendarium-widget-title"></h2>
          <div class="calendarium-widget-controls">
            <button type="button" class="calendarium-widget-size-btn" data-size-action="small" aria-label="Small">S</button>
            <button type="button" class="calendarium-widget-size-btn" data-size-action="large" aria-label="Large">L</button>
            <button type="button" class="calendarium-widget-size-btn" data-size-action="collapsed" aria-label="Collapse">&#8212;</button>
          </div>
        </header>
        <div id="widget-shortcuts-body" class="calendarium-widget-body calendarium-widget-grid"></div>
      </section>

      <section id="widget-history" class="calendarium-widget" data-widget="history" data-size="large" hidden>
        <header class="calendarium-widget-header">
          <h2 id="widget-history-title" class="calendarium-widget-title"></h2>
          <div class="calendarium-widget-controls">
            <button type="button" class="calendarium-widget-size-btn" data-size-action="small" aria-label="Small">S</button>
            <button type="button" class="calendarium-widget-size-btn" data-size-action="large" aria-label="Large">L</button>
            <button type="button" class="calendarium-widget-size-btn" data-size-action="collapsed" aria-label="Collapse">&#8212;</button>
          </div>
        </header>
        <div id="widget-history-body" class="calendarium-widget-body calendarium-widget-list"></div>
      </section>

      <section id="widget-bookmarks" class="calendarium-widget" data-widget="bookmarks" data-size="large" hidden>
        <header class="calendarium-widget-header">
          <h2 id="widget-bookmarks-title" class="calendarium-widget-title"></h2>
          <div class="calendarium-widget-controls">
            <button type="button" class="calendarium-widget-size-btn" data-size-action="small" aria-label="Small">S</button>
            <button type="button" class="calendarium-widget-size-btn" data-size-action="large" aria-label="Large">L</button>
            <button type="button" class="calendarium-widget-size-btn" data-size-action="collapsed" aria-label="Collapse">&#8212;</button>
          </div>
        </header>
        <div id="widget-bookmarks-body" class="calendarium-widget-body calendarium-widget-list"></div>
      </section>

      <section id="widget-downloads" class="calendarium-widget" data-widget="downloads" data-size="large" hidden>
        <header class="calendarium-widget-header">
          <h2 id="widget-downloads-title" class="calendarium-widget-title"></h2>
          <div class="calendarium-widget-controls">
            <button type="button" class="calendarium-widget-size-btn" data-size-action="small" aria-label="Small">S</button>
            <button type="button" class="calendarium-widget-size-btn" data-size-action="large" aria-label="Large">L</button>
            <button type="button" class="calendarium-widget-size-btn" data-size-action="collapsed" aria-label="Collapse">&#8212;</button>
          </div>
        </header>
        <div id="widget-downloads-body" class="calendarium-widget-body calendarium-widget-list"></div>
      </section>

      <section id="widget-firefox-logo" class="calendarium-widget calendarium-widget-firefox-logo" data-widget="firefox-logo" data-size="large" hidden>
        <header class="calendarium-widget-header">
          <h2 id="widget-firefox-logo-title" class="calendarium-widget-title"></h2>
          <div class="calendarium-widget-controls">
            <button type="button" class="calendarium-widget-size-btn" data-size-action="small" aria-label="Small">S</button>
            <button type="button" class="calendarium-widget-size-btn" data-size-action="large" aria-label="Large">L</button>
            <button type="button" class="calendarium-widget-size-btn" data-size-action="collapsed" aria-label="Collapse">&#8212;</button>
          </div>
        </header>
        <div class="calendarium-widget-body calendarium-firefox-logo-body">🦊</div>
      </section>

    </aside>
  </div>
  <script type="module" src="newtab.js"></script>
</body>
</html>
